server:
  port: 8080

spring:
  application:
    name: backend
  profiles:
    active: local
  # 시크릿은 이 파일에 적지 않는다(커밋되면 그대로 유출된다).
  # config/secrets.yml은 .gitignore에 걸려 있고, optional이라 파일이 없으면 무시된다.
  # 배포 서버에는 이 파일을 두지 말고 아래 각 항목의 환경변수를 채울 것.
  config:
    import: optional:file:./config/secrets.yml
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:hackathon-demo-secret-key-please-change-before-production-use-1234567890}
  access-token-expiration-ms: 43200000   # 12h
  refresh-token-expiration-ms: 604800000 # 7d

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${S3_BUCKET:ktb-ai-hackathon-451071929405-ap-northeast-2-an}

ai:
  service:
    url: ${AI_SERVICE_URL:http://13.209.6.148:8000}
    api-key: ${AI_SERVICE_API_KEY:f3b9c7e1a8d462b5c0e9f8a7d3b2c1e0f9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4}
    timeout-ms: ${AI_SERVICE_TIMEOUT_MS:60000}
    pre-request-delay-ms: ${AI_PRE_REQUEST_DELAY_MS:5000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/integrations/google/callback}
    frontend-redirect-uri: ${GOOGLE_FRONTEND_REDIRECT_URI:http://localhost:5174/mypage}
    scope: ${GOOGLE_OAUTH_SCOPE:https://www.googleapis.com/auth/calendar.events email}
    timeout-ms: ${GOOGLE_OAUTH_TIMEOUT_MS:10000}
