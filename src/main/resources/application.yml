server:
  port: 8080

spring:
  application:
    name: backend
  profiles:
    active: local
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:hackathon-demo-secret-key-please-change-before-production-use-1234567890}
  access-token-expiration-ms: 43200000   # 12h
  refresh-token-expiration-ms: 604800000 # 7d

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${S3_BUCKET:ktb-ai-hackathon-451071929405-ap-northeast-2-an}

ai:
  service:
    url: ${AI_SERVICE_URL:https://unfreeze-grab-nintendo.ngrok-free.dev}
    api-key: ${AI_SERVICE_API_KEY:local-development-key}
    timeout-ms: ${AI_SERVICE_TIMEOUT_MS:60000}
    pre-request-delay-ms: ${AI_PRE_REQUEST_DELAY_MS:4000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
