server:
  port: 8080

spring:
  application:
    name: backend
  profiles:
    active: local
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: hackathon-demo-secret-key-please-change-before-production-use-1234567890
  access-token-expiration-ms: 43200000   # 12h
  refresh-token-expiration-ms: 604800000 # 7d

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${S3_BUCKET:hackathon-dev-bucket}

ai:
  service:
    url: ${AI_SERVICE_URL:}
    api-key: ${AI_SERVICE_API_KEY:}
    timeout-ms: ${AI_SERVICE_TIMEOUT_MS:30000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
